  <meta name="theme-color" content="#f5f9ec">
  <meta name="description" content="Elan: Ernährung und Health-Daten im Blick. Offline, alle Daten bleiben auf deinem Gerät.">
  <title>Elan</title>
  <script>
    // Hell oder dunkel sofort setzen, damit beim Start nichts aufblitzt (gleiche Logik wie js/darstellung.js)
    try {
      var m = localStorage.getItem('elan.darstellung') || 'system';
      var dunkel = m === 'dunkel' || (m !== 'hell' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.modus = dunkel ? 'dunkel' : 'hell';
    } catch (e) { /* Standard bleibt hell */ }
  </script>
